<div class="manga-field-group">
  @if (label()) {
  <div class="header-label-textarea">
    <label class="etiqueta-manga">
      {{ label() }}
    </label>

    @if (contador() !== null) {
      <span
        class="contador-caracteres"
        [class.limite-cercano]="contador()! < 20">
        {{ contador() }} restantes
      </span>
    }
  </div>
}

  <input
    [type]="type()"
    [value]="value"
    [placeholder]="placeholder()"
    [disabled]="disabled"
    [attr.maxlength]="maxLength()"
    [class.invalid]="isInvalid()"
    (input)="onInput($event)"
    (blur)="onTouch()"
    class="manga-input" />

  <!-- Mini Globo de Diálogo de Error -->
  @if (isInvalid() && errorMessage()) {
    <div class="manga-error-bubble" role="alert">
      <span class="onomatopoeia-mini">¡NOOO!</span> {{ errorMessage() }}
    </div>
  }
</div>
